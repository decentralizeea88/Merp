<title>Mirna Beauty Salon — ERP Demo</title>
<style>
:root { color-scheme: light; }
:root {
  --bg: #f6f4f8;
  --surface: #ffffff;
  --text: #2c2333;
  --muted: #7d7389;
  --border: #e6e0ec;
  --primary: #8b5fbf;
  --primary-dark: #6d4599;
  --primary-soft: #f1e9fa;
  --accent: #d4808f;
  --green: #3d9970;
  --green-soft: #e3f4ec;
  --red: #c0505a;
  --red-soft: #fbe9eb;
  --amber: #b07d2b;
  --amber-soft: #fdf3df;
  --blue: #4a6fa5;
  --blue-soft: #e8eef7;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(44, 35, 51, 0.08), 0 4px 16px rgba(44, 35, 51, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.5;
}

.layout { display: flex; min-height: 100vh; }

/* ---- Sidebar ---- */
.sidebar {
  width: 232px;
  flex-shrink: 0;
  background: #2e2439;
  color: #d8cfe4;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.brand-icon { font-size: 26px; }
.brand-name { font-weight: 700; font-size: 17px; color: #fff; }
.brand-sub { font-size: 11.5px; color: #a396b3; letter-spacing: 0.06em; text-transform: uppercase; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 8px;
  color: #cfc4dd;
  text-decoration: none;
  font-weight: 500;
}
.nav a span { width: 20px; text-align: center; }
.nav a:hover { background: rgba(255, 255, 255, 0.07); color: #fff; }
.nav a.active { background: var(--primary); color: #fff; }

/* ---- Main ---- */
.main { flex: 1; padding: 26px 32px; max-width: 1280px; }
.loading { color: var(--muted); padding: 40px; }

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.page-header h1 { font-size: 22px; font-weight: 700; }
.page-header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---- Cards / stats ---- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.stat-card .label { color: var(--muted); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.stat-card .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
.stat-card .hint { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  overflow: hidden;
}
.card-title {
  padding: 14px 18px;
  font-weight: 700;
  font-size: 15px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-body { padding: 16px 18px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 980px) { .two-col { grid-template-columns: 1fr; } }

/* ---- Tables ---- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 18px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; background: #faf8fc; }
tbody tr:hover { background: #faf7fd; }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; }
.empty { padding: 28px 18px; color: var(--muted); text-align: center; }

/* ---- Badges ---- */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.badge.scheduled { background: var(--blue-soft); color: var(--blue); }
.badge.completed, .badge.paid, .badge.ok { background: var(--green-soft); color: var(--green); }
.badge.cancelled, .badge.unpaid, .badge.out { background: var(--red-soft); color: var(--red); }
.badge.no-show, .badge.low { background: var(--amber-soft); color: var(--amber); }
.badge.neutral { background: var(--primary-soft); color: var(--primary-dark); }

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { background: #f4f0f9; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-dark); }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: var(--red-soft); }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn-row { display: flex; gap: 6px; }

/* ---- Forms ---- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
input, select, textarea {
  font: inherit;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
textarea { resize: vertical; min-height: 64px; }
.checkbox-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 180px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
}
.checkbox-list label { display: flex; gap: 8px; align-items: center; font-weight: 500; color: var(--text); font-size: 13.5px; }
.checkbox-list input { width: auto; }

.search-input { max-width: 260px; }

/* ---- Modal ---- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(30, 22, 38, 0.45);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 6vh 16px;
  z-index: 50;
  overflow-y: auto;
}
.modal {
  background: var(--surface);
  border-radius: 12px;
  width: 100%;
  max-width: 560px;
  box-shadow: 0 12px 48px rgba(30, 22, 38, 0.3);
}
.modal-header {
  padding: 16px 20px;
  font-weight: 700;
  font-size: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); line-height: 1; }
.modal-body { padding: 18px 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.hidden { display: none !important; }

/* ---- Toast ---- */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #2e2439;
  color: #fff;
  padding: 12px 18px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  z-index: 100;
  font-weight: 600;
  font-size: 13.5px;
  max-width: 360px;
}
.toast.error { background: var(--red); }

/* ---- POS ---- */
.pos-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 980px) { .pos-grid { grid-template-columns: 1fr; } }
.pos-catalog { display: flex; flex-direction: column; gap: 14px; }
.pos-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 14px 18px; }
.pos-item {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  cursor: pointer;
  background: #fff;
  text-align: left;
  font: inherit;
}
.pos-item:hover { border-color: var(--primary); background: var(--primary-soft); }
.pos-item .name { font-weight: 600; font-size: 13px; white-space: normal; }
.pos-item .price { color: var(--muted); font-size: 12.5px; }
.cart-line { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.cart-line .name { flex: 1; font-weight: 600; font-size: 13.5px; }
.cart-line input.qty { width: 54px; text-align: center; padding: 4px; }
.cart-line .line-total { width: 70px; text-align: right; font-weight: 600; }
.cart-totals { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.cart-totals .row { display: flex; justify-content: space-between; }
.cart-totals .grand { font-size: 18px; font-weight: 700; border-top: 2px solid var(--border); padding-top: 8px; margin-top: 4px; }

/* ---- Appointments day groups ---- */
.day-group-title { font-weight: 700; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 14px 18px 4px; }

/* ---- Week calendar ---- */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(140px, 1fr));
  gap: 10px;
  overflow-x: auto;
}
.week-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 160px;
}
.week-col.today { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.week-col-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--muted);
  padding: 2px 2px 6px;
  border-bottom: 1px solid var(--border);
}
.week-col.today .week-col-head { color: var(--primary-dark); }
.appt-chip {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  border-left: 3px solid var(--blue);
  border-radius: 8px;
  background: var(--blue-soft);
  padding: 6px 8px;
  cursor: pointer;
  font: inherit;
}
.appt-chip.completed { border-left-color: var(--green); background: var(--green-soft); }
.appt-chip.no-show { border-left-color: var(--amber); background: var(--amber-soft); }
.appt-chip:hover { filter: brightness(0.97); }
.appt-chip .chip-time { font-weight: 700; font-size: 12px; }
.appt-chip .chip-client { font-weight: 600; font-size: 12.5px; }
.appt-chip .chip-svc { font-size: 11.5px; color: var(--muted); }
.week-empty { color: var(--border); text-align: center; padding: 12px 0; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { width: auto; }

.link { color: var(--primary-dark); cursor: pointer; text-decoration: underline; }

@media (max-width: 760px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .main { padding: 18px 14px; }
  .form-grid { grid-template-columns: 1fr; }
}

</style>
<div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">💇</span>
        <div>
          <div class="brand-name" id="brand-name">Merp</div>
          <div class="brand-sub">Salon ERP</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-view="dashboard"><span>📊</span> Dashboard</a>
        <a href="#/appointments" data-view="appointments"><span>📅</span> Appointments</a>
        <a href="#/clients" data-view="clients"><span>👤</span> Clients</a>
        <a href="#/services" data-view="services"><span>💅</span> Services</a>
        <a href="#/staff" data-view="staff"><span>🧑‍💼</span> Staff</a>
        <a href="#/inventory" data-view="inventory"><span>📦</span> Inventory</a>
        <a href="#/pos" data-view="pos"><span>🧾</span> Point of Sale</a>
        <a href="#/invoices" data-view="invoices"><span>💰</span> Invoices</a>
        <a href="#/reports" data-view="reports"><span>📈</span> Reports</a>
        <a href="#/settings" data-view="settings"><span>⚙️</span> Settings</a>
      </nav>
    </aside>
    <main class="main" id="main">
      <div class="loading">Loading…</div>
    </main>
  </div>
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast hidden" id="toast"></div>
<script>
(() => {
  const LS_KEY = 'mirna-erp-demo-db';

  function newId() {
    return Math.random().toString(16).slice(2, 10) + Math.random().toString(16).slice(2, 6);
  }

  function defaultSettings() {
    return {
      salonName: 'Mirna Beauty Salon',
      currency: 'ETB',
      taxRate: 15,
      openingTime: '09:00',
      closingTime: '19:00',
      nextInvoiceNumber: 1001
    };
  }

  function seed() {
    const iso = (d) => d.toISOString().slice(0, 10);
    const today = new Date();
    const plusDays = (n) => { const d = new Date(today); d.setDate(d.getDate() + n); return iso(d); };
    const now = () => new Date().toISOString();

    const services = [
      { id: newId(), name: "Women's Haircut", category: 'Hair', price: 800, durationMin: 45, active: true },
      { id: newId(), name: "Men's Haircut", category: 'Hair', price: 400, durationMin: 30, active: true },
      { id: newId(), name: 'Full Color', category: 'Hair', price: 2500, durationMin: 120, active: true },
      { id: newId(), name: 'Balayage', category: 'Hair', price: 3500, durationMin: 150, active: true },
      { id: newId(), name: 'Blowout & Style', category: 'Hair', price: 600, durationMin: 40, active: true },
      { id: newId(), name: 'Classic Manicure', category: 'Nails', price: 500, durationMin: 30, active: true },
      { id: newId(), name: 'Gel Manicure', category: 'Nails', price: 800, durationMin: 45, active: true },
      { id: newId(), name: 'Spa Pedicure', category: 'Nails', price: 900, durationMin: 50, active: true },
      { id: newId(), name: 'Classic Facial', category: 'Skin', price: 1200, durationMin: 60, active: true },
      { id: newId(), name: 'Deep Cleansing Facial', category: 'Skin', price: 1800, durationMin: 75, active: true },
      { id: newId(), name: 'Eyebrow Shaping', category: 'Waxing', price: 250, durationMin: 15, active: true },
      { id: newId(), name: 'Full Leg Wax', category: 'Waxing', price: 1000, durationMin: 45, active: true },
      { id: newId(), name: 'Swedish Massage (60 min)', category: 'Massage', price: 1500, durationMin: 60, active: true },
      { id: newId(), name: 'Bridal Makeup', category: 'Makeup', price: 4000, durationMin: 90, active: true }
    ];
    const staff = [
      { id: newId(), name: 'Sofia Marchetti', role: 'Senior Stylist', phone: '555-0101', email: 'sofia@mirnabeauty.example', commissionPct: 40, active: true },
      { id: newId(), name: 'Amara Okafor', role: 'Colorist', phone: '555-0102', email: 'amara@mirnabeauty.example', commissionPct: 40, active: true },
      { id: newId(), name: 'Linh Tran', role: 'Nail Technician', phone: '555-0103', email: 'linh@mirnabeauty.example', commissionPct: 35, active: true },
      { id: newId(), name: 'Elena Petrova', role: 'Esthetician', phone: '555-0104', email: 'elena@mirnabeauty.example', commissionPct: 35, active: true },
      { id: newId(), name: 'Maya Chen', role: 'Massage Therapist', phone: '555-0105', email: 'maya@mirnabeauty.example', commissionPct: 45, active: true }
    ];
    const clients = [
      { id: newId(), name: 'Olivia Bennett', phone: '555-0201', email: 'olivia.b@example.com', notes: 'Prefers Sofia. Allergic to ammonia-based dye.', createdAt: now() },
      { id: newId(), name: 'James Whitfield', phone: '555-0202', email: 'james.w@example.com', notes: '', createdAt: now() },
      { id: newId(), name: 'Priya Sharma', phone: '555-0203', email: 'priya.s@example.com', notes: 'Regular gel manicure every 3 weeks.', createdAt: now() },
      { id: newId(), name: 'Carmen Rodriguez', phone: '555-0204', email: 'carmen.r@example.com', notes: 'Bride — wedding in September.', createdAt: now() },
      { id: newId(), name: 'Hannah Lee', phone: '555-0205', email: 'hannah.l@example.com', notes: 'Sensitive skin, use fragrance-free products.', createdAt: now() }
    ];
    const products = [
      { id: newId(), name: 'Argan Oil Shampoo 250ml', sku: 'SH-001', category: 'Hair Care', costPrice: 450, salePrice: 850, stock: 24, reorderLevel: 10 },
      { id: newId(), name: 'Keratin Repair Mask 200ml', sku: 'HM-002', category: 'Hair Care', costPrice: 600, salePrice: 1100, stock: 14, reorderLevel: 8 },
      { id: newId(), name: 'Gel Polish — Ruby Red', sku: 'GP-101', category: 'Nails', costPrice: 200, salePrice: 450, stock: 6, reorderLevel: 8 },
      { id: newId(), name: 'Cuticle Oil 15ml', sku: 'CO-102', category: 'Nails', costPrice: 120, salePrice: 300, stock: 30, reorderLevel: 10 },
      { id: newId(), name: 'Hyaluronic Serum 30ml', sku: 'SR-201', category: 'Skin Care', costPrice: 800, salePrice: 1600, stock: 9, reorderLevel: 6 },
      { id: newId(), name: 'SPF 50 Day Cream 50ml', sku: 'DC-202', category: 'Skin Care', costPrice: 500, salePrice: 1000, stock: 4, reorderLevel: 6 },
      { id: newId(), name: 'Massage Oil — Lavender 1L', sku: 'MO-301', category: 'Massage', costPrice: 650, salePrice: 1300, stock: 5, reorderLevel: 4 }
    ];
    const appointments = [
      { id: newId(), clientId: clients[0].id, staffId: staff[0].id, serviceIds: [services[0].id, services[4].id], date: plusDays(0), time: '10:00', status: 'scheduled', notes: '', createdAt: now() },
      { id: newId(), clientId: clients[2].id, staffId: staff[2].id, serviceIds: [services[6].id], date: plusDays(0), time: '11:30', status: 'scheduled', notes: '', createdAt: now() },
      { id: newId(), clientId: clients[4].id, staffId: staff[3].id, serviceIds: [services[8].id], date: plusDays(0), time: '14:00', status: 'scheduled', notes: 'Fragrance-free products only.', createdAt: now() },
      { id: newId(), clientId: clients[1].id, staffId: staff[0].id, serviceIds: [services[1].id], date: plusDays(1), time: '09:30', status: 'scheduled', notes: '', createdAt: now() },
      { id: newId(), clientId: clients[3].id, staffId: staff[1].id, serviceIds: [services[3].id], date: plusDays(2), time: '13:00', status: 'scheduled', notes: 'Trial before bridal booking.', createdAt: now() },
      { id: newId(), clientId: clients[2].id, staffId: staff[2].id, serviceIds: [services[7].id], date: plusDays(-3), time: '15:00', status: 'completed', notes: '', createdAt: now() },
      { id: newId(), clientId: clients[0].id, staffId: staff[1].id, serviceIds: [services[2].id], date: plusDays(-7), time: '10:00', status: 'completed', notes: '', createdAt: now() }
    ];
    return { clients, services, staff, appointments, products, invoices: [], settings: defaultSettings() };
  }

  let db;
  try {
    db = JSON.parse(localStorage.getItem(LS_KEY)) || seed();
  } catch {
    db = seed();
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch {}
  }
  save();

  window.resetDemoData = () => {
    try { localStorage.removeItem(LS_KEY); } catch {}
    location.reload();
  };

  const CRUD = ['clients', 'services', 'staff', 'appointments', 'products', 'invoices'];
  const REQUIRED = {
    clients: ['name'], services: ['name'], staff: ['name'],
    appointments: ['clientId', 'staffId', 'date', 'time'],
    products: ['name'], invoices: ['items']
  };
  const round2 = (n) => Math.round(n * 100) / 100;

  function validate(coll, body) {
    for (const f of REQUIRED[coll] || []) {
      const v = body[f];
      if (v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0)) {
        return 'Missing required field: ' + f;
      }
    }
    return null;
  }

  function createInvoice(body) {
    const items = (body.items || []).map((it) => ({
      type: it.type === 'product' ? 'product' : 'service',
      refId: it.refId || null,
      name: String(it.name || 'Item'),
      qty: Math.max(1, Number(it.qty) || 1),
      unitPrice: Math.max(0, Number(it.unitPrice) || 0)
    }));
    if (!items.length) throw new Error('Invoice needs at least one line item');
    for (const it of items) {
      if (it.type !== 'product' || !it.refId) continue;
      const p = db.products.find((x) => x.id === it.refId);
      if (!p) throw new Error('Unknown product on invoice: ' + it.name);
      if (p.stock < it.qty) throw new Error('Insufficient stock for ' + p.name + ' (have ' + p.stock + ', need ' + it.qty + ')');
    }
    for (const it of items) {
      if (it.type !== 'product' || !it.refId) continue;
      const p = db.products.find((x) => x.id === it.refId);
      p.stock -= it.qty;
    }
    const subtotal = items.reduce((s, it) => s + it.qty * it.unitPrice, 0);
    const discount = Math.min(subtotal, Math.max(0, Number(body.discount) || 0));
    const taxRate = body.taxRate !== undefined ? Number(body.taxRate) : db.settings.taxRate;
    const tax = round2((subtotal - discount) * (taxRate / 100));
    const invoice = {
      id: newId(), createdAt: new Date().toISOString(),
      number: db.settings.nextInvoiceNumber,
      clientId: body.clientId || null,
      appointmentId: body.appointmentId || null,
      items, subtotal: round2(subtotal), discount: round2(discount),
      taxRate, tax, total: round2(subtotal - discount + tax),
      paymentMethod: body.paymentMethod || 'cash',
      status: body.status === 'unpaid' ? 'unpaid' : 'paid'
    };
    db.invoices.push(invoice);
    db.settings.nextInvoiceNumber += 1;
    if (invoice.appointmentId) {
      const a = db.appointments.find((x) => x.id === invoice.appointmentId);
      if (a) a.status = 'completed';
    }
    return invoice;
  }

  function handle(method, pathname, body) {
    const parts = pathname.split('/').filter(Boolean); // ['api', coll, id?]
    const coll = parts[1];
    const id = parts[2];

    if (coll === 'settings') {
      if (method === 'GET') return [200, db.settings];
      if (method === 'PUT') { Object.assign(db.settings, body); save(); return [200, db.settings]; }
      return [405, { error: 'Method not allowed' }];
    }
    if (!CRUD.includes(coll)) return [404, { error: 'Unknown resource' }];

    if (method === 'GET' && !id) return [200, db[coll]];
    if (method === 'GET') {
      const r = db[coll].find((x) => x.id === id);
      return r ? [200, r] : [404, { error: 'Not found' }];
    }
    if (method === 'POST' && !id) {
      const err = validate(coll, body);
      if (err) return [400, { error: err }];
      delete body.id;
      if (coll === 'invoices') {
        try { const inv = createInvoice(body); save(); return [201, inv]; }
        catch (e) { return [400, { error: e.message }]; }
      }
      const record = Object.assign({ id: newId(), createdAt: new Date().toISOString() }, body);
      db[coll].push(record);
      save();
      return [201, record];
    }
    if (method === 'PUT' && id) {
      const r = db[coll].find((x) => x.id === id);
      if (!r) return [404, { error: 'Not found' }];
      delete body.id;
      Object.assign(r, body, { id, updatedAt: new Date().toISOString() });
      save();
      return [200, r];
    }
    if (method === 'DELETE' && id) {
      const i = db[coll].findIndex((x) => x.id === id);
      if (i === -1) return [404, { error: 'Not found' }];
      db[coll].splice(i, 1);
      save();
      return [200, { ok: true }];
    }
    return [405, { error: 'Method not allowed' }];
  }

  const realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = async (url, opts = {}) => {
    const u = typeof url === 'string' ? url : url.url;
    if (!u.startsWith('/api/')) {
      if (realFetch) return realFetch(url, opts);
      throw new Error('Network unavailable in demo');
    }
    const body = opts.body ? JSON.parse(opts.body) : {};
    const [status, data] = handle((opts.method || 'GET').toUpperCase(), u, body);
    return new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  };
})();
</script>
<script>
/* Merp — beauty salon ERP frontend (vanilla JS SPA). */
(() => {
  const $ = (sel, root = document) => root.querySelector(sel);
  const main = $('#main');

  const state = {
    clients: [],
    services: [],
    staff: [],
    appointments: [],
    products: [],
    invoices: [],
    settings: {},
    cart: [] // POS cart lines {type, refId, name, qty, unitPrice}
  };

  // ---------- API ----------
  async function api(method, path, body) {
    const res = await fetch(`/api/${path}`, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  async function loadAll() {
    const [clients, services, staff, appointments, products, invoices, settings] = await Promise.all([
      api('GET', 'clients'), api('GET', 'services'), api('GET', 'staff'),
      api('GET', 'appointments'), api('GET', 'products'), api('GET', 'invoices'),
      api('GET', 'settings')
    ]);
    Object.assign(state, { clients, services, staff, appointments, products, invoices, settings });
  }

  // ---------- Helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => new Intl.NumberFormat(undefined, { style: 'currency', currency: state.settings.currency || 'USD' }).format(n || 0);
  const todayISO = () => new Date().toISOString().slice(0, 10);
  const byId = (coll, id) => state[coll].find((x) => x.id === id);
  const clientName = (id) => byId('clients', id)?.name || '—';
  const staffName = (id) => byId('staff', id)?.name || '—';
  const serviceNames = (ids) => (ids || []).map((id) => byId('services', id)?.name || '?').join(', ');
  const fmtDate = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  };

  function downloadCSV(filename, rows) {
    if (!rows.length) return toast('Nothing to export', true);
    const headers = Object.keys(rows[0]);
    const cell = (v) => {
      v = String(v ?? '');
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    const csv = [headers.join(','), ...rows.map((r) => headers.map((h) => cell(r[h])).join(','))].join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
    toast(`Exported ${filename}`);
  }

  function toast(msg, isError = false) {
    const el = $('#toast');
    el.textContent = msg;
    el.className = `toast${isError ? ' error' : ''}`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.add('hidden'), 3200);
  }

  // ---------- Modal ----------
  function openModal(title, bodyHtml, { onSubmit, submitLabel = 'Save' } = {}) {
    const backdrop = $('#modal-backdrop');
    const modal = $('#modal');
    modal.innerHTML = `
      <div class="modal-header"><span>${esc(title)}</span><button class="modal-close" aria-label="Close">✕</button></div>
      <form id="modal-form">
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-footer">
          <button type="button" class="btn" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn primary">${esc(submitLabel)}</button>
        </div>
      </form>`;
    backdrop.classList.remove('hidden');
    const close = () => backdrop.classList.add('hidden');
    $('.modal-close', modal).onclick = close;
    $('#modal-cancel', modal).onclick = close;
    backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
    $('#modal-form', modal).onsubmit = async (e) => {
      e.preventDefault();
      if (!onSubmit) return close();
      try {
        await onSubmit(new FormData(e.target), e.target);
        close();
      } catch (err) {
        toast(err.message, true);
      }
    };
    return { close };
  }

  function field(label, inputHtml, full = false) {
    return `<label class="field${full ? ' full' : ''}">${esc(label)}${inputHtml}</label>`;
  }
  const options = (items, selected, labelFn = (x) => x.name) =>
    items.map((x) => `<option value="${x.id}" ${x.id === selected ? 'selected' : ''}>${esc(labelFn(x))}</option>`).join('');

  // ---------- Views ----------
  const views = {
    dashboard: renderDashboard,
    appointments: renderAppointments,
    clients: renderClients,
    services: renderServices,
    staff: renderStaff,
    inventory: renderInventory,
    pos: renderPOS,
    invoices: renderInvoices,
    reports: renderReports,
    settings: renderSettings
  };

  function header(title, sub, actionsHtml = '') {
    return `<div class="page-header">
      <div><h1>${esc(title)}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
      <div class="header-actions">${actionsHtml}</div>
    </div>`;
  }

  // ----- Dashboard -----
  function renderDashboard() {
    const today = todayISO();
    const todaysAppts = state.appointments
      .filter((a) => a.date === today && a.status !== 'cancelled')
      .sort((a, b) => a.time.localeCompare(b.time));
    const monthStart = today.slice(0, 7);
    const monthInvoices = state.invoices.filter((i) => (i.createdAt || '').slice(0, 7) === monthStart && i.status === 'paid');
    const monthRevenue = monthInvoices.reduce((s, i) => s + i.total, 0);
    const todayRevenue = state.invoices
      .filter((i) => (i.createdAt || '').slice(0, 10) === today && i.status === 'paid')
      .reduce((s, i) => s + i.total, 0);
    const lowStock = state.products.filter((p) => p.stock <= p.reorderLevel);
    const upcoming = state.appointments
      .filter((a) => a.date > today && a.status === 'scheduled')
      .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
      .slice(0, 6);

    main.innerHTML = `
      ${header(state.settings.salonName || 'Dashboard', `Overview for ${fmtDate(today)}`,
        `<a class="btn primary" href="#/appointments?new=1">＋ New appointment</a>
         <a class="btn" href="#/pos">Open POS</a>`)}
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Today's appointments</div><div class="value">${todaysAppts.length}</div><div class="hint">${todaysAppts.filter((a) => a.status === 'completed').length} completed</div></div>
        <div class="stat-card"><div class="label">Revenue today</div><div class="value">${money(todayRevenue)}</div><div class="hint">paid invoices</div></div>
        <div class="stat-card"><div class="label">Revenue this month</div><div class="value">${money(monthRevenue)}</div><div class="hint">${monthInvoices.length} invoices</div></div>
        <div class="stat-card"><div class="label">Clients</div><div class="value">${state.clients.length}</div><div class="hint">${state.staff.filter((s) => s.active).length} active staff</div></div>
        <div class="stat-card"><div class="label">Low stock items</div><div class="value">${lowStock.length}</div><div class="hint">${lowStock.length ? 'needs reorder' : 'all stocked'}</div></div>
      </div>
      <div class="two-col">
        <div class="card">
          <div class="card-title">Today's schedule</div>
          ${apptTable(todaysAppts, { hideDate: true })}
        </div>
        <div>
          <div class="card">
            <div class="card-title">Upcoming appointments</div>
            ${apptTable(upcoming, { compact: true })}
          </div>
          <div class="card">
            <div class="card-title">Low stock alerts</div>
            ${lowStock.length ? `<div class="table-wrap"><table><thead><tr><th>Product</th><th class="num">Stock</th><th class="num">Reorder at</th></tr></thead><tbody>
              ${lowStock.map((p) => `<tr><td>${esc(p.name)}</td><td class="num"><span class="badge ${p.stock === 0 ? 'out' : 'low'}">${p.stock}</span></td><td class="num">${p.reorderLevel}</td></tr>`).join('')}
            </tbody></table></div>` : '<div class="empty">All products are above reorder level 🎉</div>'}
          </div>
        </div>
      </div>`;
    bindApptRowActions();
  }

  // ----- Appointments -----
  function apptTable(appts, { hideDate = false, compact = false, actions = false } = {}) {
    if (!appts.length) return '<div class="empty">No appointments</div>';
    return `<div class="table-wrap"><table><thead><tr>
      ${hideDate ? '' : '<th>Date</th>'}<th>Time</th><th>Client</th><th>Service(s)</th>${compact ? '' : '<th>Staff</th>'}<th>Status</th>${actions ? '<th></th>' : ''}
    </tr></thead><tbody>
      ${appts.map((a) => `<tr>
        ${hideDate ? '' : `<td>${fmtDate(a.date)}</td>`}
        <td>${esc(a.time)}</td>
        <td>${esc(clientName(a.clientId))}</td>
        <td style="white-space:normal">${esc(serviceNames(a.serviceIds))}</td>
        ${compact ? '' : `<td>${esc(staffName(a.staffId))}</td>`}
        <td><span class="badge ${a.status}">${a.status}</span></td>
        ${actions ? `<td class="btn-row">
          ${a.status === 'scheduled' ? `<button class="btn small" data-act="checkout" data-id="${a.id}">Checkout</button>
          <button class="btn small" data-act="edit-appt" data-id="${a.id}">Edit</button>
          <button class="btn small danger" data-act="cancel-appt" data-id="${a.id}">Cancel</button>` : `<button class="btn small danger" data-act="del-appt" data-id="${a.id}">Delete</button>`}
        </td>` : ''}
      </tr>`).join('')}
    </tbody></table></div>`;
  }

  function bindApptRowActions() {
    main.querySelectorAll('[data-act]').forEach((btn) => {
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      btn.onclick = async () => {
        if (act === 'edit-appt') return appointmentForm(byId('appointments', id));
        if (act === 'cancel-appt') {
          await api('PUT', `appointments/${id}`, { status: 'cancelled' });
          await refresh('Appointment cancelled');
        }
        if (act === 'del-appt') {
          if (!confirm('Delete this appointment?')) return;
          await api('DELETE', `appointments/${id}`);
          await refresh('Appointment deleted');
        }
        if (act === 'checkout') {
          const appt = byId('appointments', id);
          state.cart = (appt.serviceIds || []).map((sid) => {
            const s = byId('services', sid);
            return { type: 'service', refId: sid, name: s?.name || 'Service', qty: 1, unitPrice: s?.price || 0 };
          });
          state.cartClientId = appt.clientId;
          state.cartAppointmentId = appt.id;
          location.hash = '#/pos';
        }
      };
    });
  }

  function viewToggle(mode) {
    return `<div class="btn-row">
      <button class="btn small ${mode === 'list' ? 'primary' : ''}" id="mode-list">List</button>
      <button class="btn small ${mode === 'week' ? 'primary' : ''}" id="mode-week">Week</button>
    </div>`;
  }

  function bindViewToggle() {
    $('#mode-list').onclick = () => { state.apptMode = 'list'; renderAppointments(); };
    $('#mode-week').onclick = () => { state.apptMode = 'week'; renderAppointments(); };
  }

  function renderAppointments() {
    if ((state.apptMode || 'list') === 'week') return renderWeekView();
    const params = new URLSearchParams(location.hash.split('?')[1] || '');
    const filter = state.apptFilter || { status: 'all', staffId: 'all', from: todayISO() };
    let appts = [...state.appointments];
    if (filter.status !== 'all') appts = appts.filter((a) => a.status === filter.status);
    if (filter.staffId !== 'all') appts = appts.filter((a) => a.staffId === filter.staffId);
    if (filter.from) appts = appts.filter((a) => a.date >= filter.from);
    appts.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    // group by date
    const groups = {};
    for (const a of appts) (groups[a.date] ||= []).push(a);

    main.innerHTML = `
      ${header('Appointments', `${appts.length} shown`, `${viewToggle('list')} <button class="btn primary" id="new-appt">＋ New appointment</button>`)}
      <div class="card"><div class="card-body filters">
        <label class="field">Status<select id="f-status">
          ${['all', 'scheduled', 'completed', 'cancelled', 'no-show'].map((s) => `<option ${filter.status === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select></label>
        <label class="field">Staff<select id="f-staff"><option value="all">all</option>${options(state.staff, filter.staffId)}</select></label>
        <label class="field">From date<input type="date" id="f-from" value="${filter.from || ''}"></label>
        <button class="btn small" id="f-clear" style="align-self:flex-end">Show all dates</button>
      </div></div>
      ${Object.keys(groups).length === 0 ? '<div class="card"><div class="empty">No appointments match the filters</div></div>' : ''}
      ${Object.entries(groups).map(([date, list]) => `
        <div class="card">
          <div class="day-group-title">${fmtDate(date)} — ${list.length} appointment${list.length > 1 ? 's' : ''}</div>
          ${apptTable(list, { hideDate: true, actions: true })}
        </div>`).join('')}`;

    bindViewToggle();
    $('#new-appt').onclick = () => appointmentForm();
    $('#f-status').onchange = (e) => { state.apptFilter = { ...filter, status: e.target.value }; renderAppointments(); };
    $('#f-staff').onchange = (e) => { state.apptFilter = { ...filter, staffId: e.target.value }; renderAppointments(); };
    $('#f-from').onchange = (e) => { state.apptFilter = { ...filter, from: e.target.value }; renderAppointments(); };
    $('#f-clear').onclick = () => { state.apptFilter = { ...filter, from: '' }; renderAppointments(); };
    bindApptRowActions();
    if (params.get('new')) {
      history.replaceState(null, '', '#/appointments');
      appointmentForm();
    }
  }

  function renderWeekView() {
    // Monday of the displayed week, stored as ISO date.
    if (!state.weekStart) {
      const d = new Date();
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      state.weekStart = d.toISOString().slice(0, 10);
    }
    const start = new Date(state.weekStart + 'T00:00:00');
    const days = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      return d.toISOString().slice(0, 10);
    });
    const end = days[6];
    const shift = (n) => {
      const d = new Date(start);
      d.setDate(d.getDate() + n);
      state.weekStart = d.toISOString().slice(0, 10);
      renderAppointments();
    };
    const rangeLabel = `${fmtDate(days[0])} – ${fmtDate(end)}`;

    main.innerHTML = `
      ${header('Appointments', rangeLabel, `${viewToggle('week')}
        <div class="btn-row">
          <button class="btn small" id="wk-prev">‹ Prev</button>
          <button class="btn small" id="wk-today">Today</button>
          <button class="btn small" id="wk-next">Next ›</button>
        </div>
        <button class="btn primary" id="new-appt">＋ New appointment</button>`)}
      <div class="week-grid">
        ${days.map((date) => {
          const isToday = date === todayISO();
          const appts = state.appointments
            .filter((a) => a.date === date && a.status !== 'cancelled')
            .sort((a, b) => a.time.localeCompare(b.time));
          return `<div class="week-col${isToday ? ' today' : ''}">
            <div class="week-col-head">
              <span>${fmtDate(date)}</span>
              <button class="btn small" data-book="${date}" title="Book on this day">＋</button>
            </div>
            ${appts.map((a) => `
              <button class="appt-chip ${a.status}" data-chip="${a.id}">
                <div class="chip-time">${esc(a.time)} · ${esc(staffName(a.staffId))}</div>
                <div class="chip-client">${esc(clientName(a.clientId))}</div>
                <div class="chip-svc">${esc(serviceNames(a.serviceIds))}</div>
              </button>`).join('') || '<div class="week-empty">—</div>'}
          </div>`;
        }).join('')}
      </div>`;

    bindViewToggle();
    $('#new-appt').onclick = () => appointmentForm();
    $('#wk-prev').onclick = () => shift(-7);
    $('#wk-next').onclick = () => shift(7);
    $('#wk-today').onclick = () => { state.weekStart = null; renderAppointments(); };
    main.querySelectorAll('[data-book]').forEach((btn) => {
      btn.onclick = () => appointmentForm(null, { date: btn.dataset.book });
    });
    main.querySelectorAll('[data-chip]').forEach((btn) => {
      btn.onclick = () => appointmentForm(byId('appointments', btn.dataset.chip));
    });
  }

  function appointmentForm(appt, defaults = {}) {
    const isEdit = !!appt;
    appt = appt || { date: defaults.date || todayISO(), time: '10:00', status: 'scheduled', serviceIds: [] };
    const activeServices = state.services.filter((s) => s.active !== false);
    openModal(isEdit ? 'Edit appointment' : 'New appointment', `
      <div class="form-grid">
        ${field('Client', `<select name="clientId" required><option value="">— select —</option>${options(state.clients, appt.clientId)}</select>`)}
        ${field('Staff', `<select name="staffId" required><option value="">— select —</option>${options(state.staff.filter((s) => s.active !== false), appt.staffId)}</select>`)}
        ${field('Date', `<input type="date" name="date" value="${appt.date}" required>`)}
        ${field('Time', `<input type="time" name="time" value="${appt.time}" required>`)}
        ${field('Services', `<div class="checkbox-list">${activeServices.map((s) => `
          <label><input type="checkbox" name="serviceIds" value="${s.id}" ${appt.serviceIds?.includes(s.id) ? 'checked' : ''}> ${esc(s.name)} — ${money(s.price)} (${s.durationMin} min)</label>`).join('')}</div>`, true)}
        ${isEdit ? field('Status', `<select name="status">${['scheduled', 'completed', 'cancelled', 'no-show'].map((s) => `<option ${appt.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>`) : ''}
        ${field('Notes', `<textarea name="notes">${esc(appt.notes || '')}</textarea>`, true)}
      </div>`, {
      onSubmit: async (fd) => {
        const body = {
          clientId: fd.get('clientId'),
          staffId: fd.get('staffId'),
          date: fd.get('date'),
          time: fd.get('time'),
          serviceIds: fd.getAll('serviceIds'),
          notes: fd.get('notes') || '',
          status: fd.get('status') || appt.status
        };
        if (body.serviceIds.length === 0) throw new Error('Select at least one service');
        if (isEdit) await api('PUT', `appointments/${appt.id}`, body);
        else await api('POST', 'appointments', body);
        await refresh(isEdit ? 'Appointment updated' : 'Appointment booked');
      }
    });
  }

  // ----- Clients -----
  function renderClients() {
    const q = (state.clientSearch || '').toLowerCase();
    const clients = state.clients
      .filter((c) => !q || c.name.toLowerCase().includes(q) || (c.phone || '').includes(q) || (c.email || '').toLowerCase().includes(q))
      .sort((a, b) => a.name.localeCompare(b.name));

    main.innerHTML = `
      ${header('Clients', `${state.clients.length} total`, `
        <input class="search-input" id="client-search" placeholder="Search name, phone, email…" value="${esc(state.clientSearch || '')}">
        <button class="btn primary" id="new-client">＋ New client</button>`)}
      <div class="card">${clients.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th class="num">Visits</th><th class="num">Total spent</th><th></th></tr></thead>
        <tbody>${clients.map((c) => {
          const visits = state.appointments.filter((a) => a.clientId === c.id && a.status === 'completed').length;
          const spent = state.invoices.filter((i) => i.clientId === c.id && i.status === 'paid').reduce((s, i) => s + i.total, 0);
          return `<tr>
            <td><span class="link" data-act="view-client" data-id="${c.id}">${esc(c.name)}</span></td>
            <td>${esc(c.phone || '—')}</td><td>${esc(c.email || '—')}</td>
            <td class="num">${visits}</td><td class="num">${money(spent)}</td>
            <td class="btn-row">
              <button class="btn small" data-act="edit-client" data-id="${c.id}">Edit</button>
              <button class="btn small danger" data-act="del-client" data-id="${c.id}">Delete</button>

            </div>

              </select>
              <button class="btn primary" id="cart-pay" ${cart.length ? '' : 'disabled'}>Take payment</button>

          </div>
        </div>

    main.querySelectorAll('.pos-item').forEach((btn) => {

        const src = type === 'service' ? byId('services', id) : byId('products', id);

        renderPOS();

    main.querySelectorAll('.cart-line .qty').forEach((inp) => {

  // ----- Reports -----
  function renderReports() {
    const month = state.reportMonth || todayISO().slice(0, 7);
    const monthLabel = new Date(month + '-01T00:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    const invoices = state.invoices.filter((i) => i.status === 'paid' && (i.createdAt || '').slice(0, 7) === month);
    const revenue = invoices.reduce((s, i) => s + i.total, 0);
    const avgTicket = invoices.length ? revenue / invoices.length : 0;
    const lineRev = (type) => invoices.reduce((s, i) => s + i.items.filter((it) => it.type === type).reduce((x, it) => x + it.qty * it.unitPrice, 0), 0);
    const serviceRev = lineRev('service');
    const productRev = lineRev('product');

    const completed = state.appointments.filter((a) => a.status === 'completed' && a.date.slice(0, 7) === month);

    // Commission payouts: each staff member's completed-appointment service
    // revenue for the month times their commission rate.
    const commissions = state.staff.map((s) => {
      const appts = completed.filter((a) => a.staffId === s.id);
      const rev = appts.reduce((sum, a) => sum + (a.serviceIds || []).reduce((x, sid) => x + (byId('services', sid)?.price || 0), 0), 0);
      return { staff: s, appts: appts.length, revenue: rev, payout: rev * (s.commissionPct || 0) / 100 };
    }).filter((c) => c.appts > 0 || c.staff.active !== false);

    // Top services by bookings this month.
    const counts = {};
    for (const a of completed) for (const sid of a.serviceIds || []) counts[sid] = (counts[sid] || 0) + 1;
    const topServices = Object.entries(counts)
      .map(([sid, n]) => ({ svc: byId('services', sid), n }))
      .filter((x) => x.svc)
      .sort((a, b) => b.n - a.n)
      .slice(0, 8);

    main.innerHTML = `
      ${header('Reports', monthLabel, `
        <input type="month" id="report-month" value="${month}">
        <button class="btn" id="exp-commissions">⬇ Commissions CSV</button>
        <button class="btn" id="exp-invoices">⬇ Invoices CSV</button>
        <button class="btn" id="exp-clients">⬇ Clients CSV</button>`)}
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Revenue</div><div class="value">${money(revenue)}</div><div class="hint">${invoices.length} paid invoices</div></div>
        <div class="stat-card"><div class="label">Average ticket</div><div class="value">${money(avgTicket)}</div><div class="hint">per invoice</div></div>
        <div class="stat-card"><div class="label">Service sales</div><div class="value">${money(serviceRev)}</div><div class="hint">before discount/tax</div></div>
        <div class="stat-card"><div class="label">Retail sales</div><div class="value">${money(productRev)}</div><div class="hint">before discount/tax</div></div>
        <div class="stat-card"><div class="label">Completed visits</div><div class="value">${completed.length}</div><div class="hint">appointments</div></div>
      </div>
      <div class="two-col">
        <div class="card">
          <div class="card-title">Staff commission payouts</div>
          ${commissions.length ? `<div class="table-wrap"><table>
            <thead><tr><th>Staff</th><th class="num">Visits</th><th class="num">Service revenue</th><th class="num">Rate</th><th class="num">Payout</th></tr></thead>
            <tbody>${commissions.map((c) => `<tr>
              <td>${esc(c.staff.name)}</td><td class="num">${c.appts}</td>
              <td class="num">${money(c.revenue)}</td><td class="num">${c.staff.commissionPct ?? 0}%</td>
              <td class="num"><strong>${money(c.payout)}</strong></td></tr>`).join('')}
              <tr><td><strong>Total</strong></td><td class="num">${completed.length}</td>
                <td class="num"><strong>${money(commissions.reduce((s, c) => s + c.revenue, 0))}</strong></td><td></td>
                <td class="num"><strong>${money(commissions.reduce((s, c) => s + c.payout, 0))}</strong></td></tr>
            </tbody></table></div>` : '<div class="empty">No completed appointments this month</div>'}
        </div>
        <div class="card">
          <div class="card-title">Top services</div>
          ${topServices.length ? `<div class="table-wrap"><table>
            <thead><tr><th>Service</th><th class="num">Bookings</th><th class="num">List price</th></tr></thead>
            <tbody>${topServices.map((t) => `<tr><td>${esc(t.svc.name)}</td><td class="num">${t.n}</td><td class="num">${money(t.svc.price)}</td></tr>`).join('')}</tbody>
          </table></div>` : '<div class="empty">No completed appointments this month</div>'}
        </div>
      </div>`;

    $('#report-month').onchange = (e) => { state.reportMonth = e.target.value; renderReports(); };
    $('#exp-commissions').onclick = () => downloadCSV(`commissions-${month}.csv`, commissions.map((c) => ({
      staff: c.staff.name, role: c.staff.role || '', visits: c.appts,
      service_revenue: c.revenue.toFixed(2), commission_pct: c.staff.commissionPct ?? 0, payout: c.payout.toFixed(2)
    })));
    $('#exp-invoices').onclick = () => downloadCSV(`invoices-${month}.csv`, invoices.map((i) => ({
      number: i.number, date: (i.createdAt || '').slice(0, 10), client: i.clientId ? clientName(i.clientId) : 'Walk-in',
      items: i.items.map((it) => `${it.qty}x ${it.name}`).join('; '),
      subtotal: i.subtotal.toFixed(2), discount: i.discount.toFixed(2), tax: i.tax.toFixed(2),
      total: i.total.toFixed(2), payment: i.paymentMethod, status: i.status
    })));
    $('#exp-clients').onclick = () => downloadCSV('clients.csv', state.clients.map((c) => ({
      name: c.name, phone: c.phone || '', email: c.email || '', notes: c.notes || '',
      visits: state.appointments.filter((a) => a.clientId === c.id && a.status === 'completed').length,
      total_spent: state.invoices.filter((i) => i.clientId === c.id && i.status === 'paid').reduce((s, i) => s + i.total, 0).toFixed(2)
    })));
  }

  // ----- Settings -----
  function renderSettings() {
    const s = state.settings;
    main.innerHTML = `
      ${header('Settings', 'Salon configuration')}
      <div class="card" style="max-width:560px"><div class="card-body">
        <form id="settings-form" class="form-grid">
          ${field('Salon name', `<input name="salonName" value="${esc(s.salonName || '')}" required>`, true)}
          ${field('Currency (ISO code)', `<input name="currency" value="${esc(s.currency || 'USD')}" maxlength="3" style="text-transform:uppercase">`)}
          ${field('Tax rate %', `<input type="number" step="0.01" min="0" name="taxRate" value="${s.taxRate ?? 0}">`)}
          ${field('Opening time', `<input type="time" name="openingTime" value="${esc(s.openingTime || '09:00')}">`)}
          ${field('Closing time', `<input type="time" name="closingTime" value="${esc(s.closingTime || '19:00')}">`)}
          <div class="full"><button class="btn primary" type="submit">Save settings</button></div>
        </form>
      </div></div>`;
    $('#settings-form').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('PUT', 'settings', {
          salonName: fd.get('salonName'),
          currency: (fd.get('currency') || 'USD').toUpperCase(),
          taxRate: Number(fd.get('taxRate')) || 0,
          openingTime: fd.get('openingTime'),
          closingTime: fd.get('closingTime')
        });
        await refresh('Settings saved');
      } catch (err) {
        toast(err.message, true);
      }
    };
  }

  // ---------- Router ----------
  function currentView() {
    const hash = (location.hash || '#/dashboard').slice(2);
    return hash.split('?')[0] || 'dashboard';
  }

  function route() {
    const view = views[currentView()] ? currentView() : 'dashboard';
    document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.view === view));
    views[view]();
  }

  async function refresh(msg) {
    await loadAll();
    route();
    if (msg) toast(msg);
  }

  window.addEventListener('hashchange', route);

  loadAll()
    .then(() => {
      $('#brand-name').textContent = state.settings.salonName || 'Merp';
      route();
    })
    .catch((e) => {
      main.innerHTML = `<div class="empty">Failed to load data: ${esc(e.message)}</div>`;
    });
})();

</script>

    note.innerHTML = 'Demo mode — data is saved in this browser only.<br><a href="#" style="color:#cfc4dd" onclick="resetDemoData();return false">Reset demo data</a>';
