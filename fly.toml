# Fly.io config. Create the data volume once before first deploy:
#   fly volumes create merp_data --size 1
app = "mirna-salon-erp"
primary_region = "jnb" # Johannesburg — closest region to Ethiopia

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "merp_data"
  destination = "/data"

[env]
  MERP_DATA_DIR = "/data"
